<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080810">
<title>My Space</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap');

  :root {
    --bg:        #080810;
    --bg2:       #0d0d1f;
    --surface:   #111128;
    --surface2:  #16163a;
    --border:    rgba(255,255,255,0.07);
    --border2:   rgba(255,255,255,0.11);
    --text:      #eeeef8;
    --muted:     #55557a;
    --muted2:    #8888b0;
    --purple:    #a78bfa;
    --purple2:   #7c3aed;
    --purple3:   #c4b5fd;
    --glow:      rgba(167,139,250,0.2);
    --glow2:     rgba(167,139,250,0.08);
    --high:      #f87171;
    --high-bg:   rgba(248,113,113,0.1);
    --med:       #fbbf24;
    --med-bg:    rgba(251,191,36,0.1);
    --low:       #a78bfa;
    --low-bg:    rgba(167,139,250,0.1);
    --radius:    16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    overscroll-behavior: none;
  }

  /* ── TOPBAR ── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8,8,16,0.93);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 0;
  }

  .topbar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .topbar-title {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #a78bfa, #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  .topbar-date {
    font-size: 11px;
    color: var(--muted2);
    font-weight: 400;
    letter-spacing: 0.5px;
  }

  .tabs {
    display: flex;
  }

  .tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.25s;
    position: relative;
  }

  .tab.active { color: var(--text); border-bottom-color: var(--purple); }

  .tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 20%; right: 20%;
    height: 2px;
    background: var(--purple);
    box-shadow: 0 0 10px var(--glow);
    border-radius: 2px;
  }

  /* ── CONTENT ── */
  .content {
    padding: 20px 16px 100px;
    max-width: 600px;
    margin: 0 auto;
  }

  .view { display: none; }
  .view.active { display: block; animation: fadeUp 0.3s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @keyframes slideFromRight {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ── STAT STRIP ── */
  .stat-strip {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 10px;
    text-align: center;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--purple), transparent);
    opacity: 0.7;
  }

  .stat-card:nth-child(1) { animation-delay: 0.05s; }
  .stat-card:nth-child(2) { animation-delay: 0.1s; }
  .stat-card:nth-child(3) { animation-delay: 0.15s; }

  .stat-label {
    font-size: 10px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  .stat-value.purple { color: var(--purple); }

  .stat-unit {
    font-size: 10px;
    color: var(--muted2);
    margin-top: 3px;
  }

  /* ── ADD BOX ── */
  .add-box {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 22px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.35);
  }

  .add-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
  }

  .add-input {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .add-input:focus {
    border-color: rgba(167,139,250,0.45);
    box-shadow: 0 0 0 3px rgba(167,139,250,0.07);
  }

  .add-input::placeholder { color: var(--muted); }

  .priority-row {
    display: flex;
    gap: 8px;
  }

  select.meta-select {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--muted2);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    padding: 9px 10px;
    outline: none;
    cursor: pointer;
  }

  select.meta-select:focus { border-color: rgba(167,139,250,0.4); }

  .btn-add {
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px 20px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    box-shadow: 0 0 18px rgba(124,58,237,0.4);
    white-space: nowrap;
  }

  .btn-add:active { opacity: 0.85; transform: scale(0.97); }

  /* ── TASK ITEM ── */
  .task-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    transition: border-color 0.2s;
    animation: slideIn 0.25s ease both;
    position: relative;
    overflow: hidden;
  }

  .task-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    border-radius: 3px 0 0 3px;
    background: var(--purple);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .task-item:not(.done-item):active::before { opacity: 1; }

  .task-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--muted);
    background: none;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .task-check.checked {
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    border-color: transparent;
    box-shadow: 0 0 12px rgba(167,139,250,0.5);
  }

  .task-check.checked::after {
    content: '✓';
    font-size: 11px;
    color: #fff;
    font-weight: 700;
  }

  .task-check:active { transform: scale(0.88); }

  .task-body { flex: 1; min-width: 0; }

  .task-text {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    word-break: break-word;
  }

  .task-text.done {
    text-decoration: line-through;
    color: var(--muted);
  }

  .task-meta {
    display: flex;
    gap: 6px;
    margin-top: 7px;
  }

  .tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.4px;
    padding: 2px 8px;
    border-radius: 8px;
    text-transform: uppercase;
  }

  .tag-high { background: var(--high-bg); color: var(--high); }
  .tag-med  { background: var(--med-bg);  color: var(--med); }
  .tag-low  { background: var(--low-bg);  color: var(--low); }

  .task-delete {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
    transition: color 0.2s;
    flex-shrink: 0;
  }

  .task-delete:active { color: var(--high); }

  /* ── SECTION LABEL ── */
  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── DONE TOGGLE ── */
  .done-toggle {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--muted2);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 10px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    width: 100%;
    transition: border-color 0.2s;
  }

  .done-toggle:active { border-color: rgba(167,139,250,0.3); }

  .done-arrow { transition: transform 0.25s; display: inline-block; font-size: 10px; }
  .done-arrow.open { transform: rotate(90deg); }

  .done-section { display: none; }
  .done-section.open { display: block; animation: fadeUp 0.2s ease; }
  .done-item { opacity: 0.4; }

  /* ── EMPTY ── */
  .empty {
    text-align: center;
    padding: 44px 20px;
    color: var(--muted);
    font-size: 13px;
    line-height: 2;
  }

  .empty-glyph {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    font-size: 20px;
  }

  /* ── NOTES ── */
  .notes-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }

  .notes-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
  }

  .btn-new-note {
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 9px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(124,58,237,0.35);
    transition: opacity 0.2s, transform 0.15s;
  }

  .btn-new-note:active { opacity: 0.85; transform: scale(0.97); }

  /* NOTE COLOR SWATCHES */
  .note-colors {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .color-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }

  .color-dot:active { transform: scale(0.88); }
  .color-dot.selected { border-color: #fff; transform: scale(1.15); }

  .note-card {
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    animation: slideIn 0.25s ease both;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .note-card:active { transform: scale(0.99); }

  .note-card-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .note-card-preview {
    font-size: 12px;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    opacity: 0.75;
  }

  .note-card-date {
    font-size: 10px;
    margin-top: 10px;
    opacity: 0.5;
    letter-spacing: 0.3px;
  }

  /* ── NOTE EDITOR ── */
  .note-editor {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 200;
    flex-direction: column;
  }

  .note-editor.open { display: flex; animation: slideFromRight 0.25s ease; }

  .editor-topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: rgba(8,8,16,0.95);
    backdrop-filter: blur(12px);
  }

  .btn-back {
    background: none;
    border: none;
    color: var(--purple3);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 0;
  }

  .editor-actions { margin-left: auto; }

  .btn-delete-note {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.25);
    color: var(--high);
    border-radius: var(--radius-sm);
    padding: 7px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-delete-note:active { background: rgba(248,113,113,0.22); }

  /* Color picker inside editor */
  .editor-color-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .editor-color-label {
    font-size: 11px;
    color: var(--muted2);
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .editor-title-input {
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    padding: 18px 18px 14px;
    outline: none;
    width: 100%;
    flex-shrink: 0;
    letter-spacing: -0.3px;
  }

  .editor-title-input::placeholder { color: var(--muted); }

  .editor-body-input {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.9;
    padding: 16px 18px;
    outline: none;
    resize: none;
    width: 100%;
  }

  .editor-body-input::placeholder { color: var(--muted); }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-title">My Space</div>
    <div class="topbar-date" id="today-date"></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('todos')">Tasks</button>
    <button class="tab" onclick="switchTab('notes')">Notes</button>
  </div>
</div>

<div class="content">

  <!-- TASKS VIEW -->
  <div class="view active" id="view-todos">

    <div class="stat-strip">
      <div class="stat-card">
        <div class="stat-label">Active</div>
        <div class="stat-value purple" id="stat-active">0</div>
        <div class="stat-unit">tasks</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Done</div>
        <div class="stat-value" id="stat-done">0</div>
        <div class="stat-unit">completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">High</div>
        <div class="stat-value" id="stat-high" style="color:var(--high)">0</div>
        <div class="stat-unit">priority</div>
      </div>
    </div>

    <div class="add-box">
      <div class="add-row">
        <input class="add-input" id="task-input" type="text" placeholder="What needs to be done?" maxlength="200" onkeydown="if(event.key==='Enter')addTask()">
        <button class="btn-add" onclick="addTask()">Add</button>
      </div>
      <div class="priority-row">
        <select class="meta-select" id="task-priority">
          <option value="high">🔴 High priority</option>
          <option value="med" selected>🟡 Medium priority</option>
          <option value="low">🟣 Low priority</option>
        </select>
      </div>
    </div>

    <div id="active-tasks"></div>

    <button class="done-toggle" onclick="toggleDone()">
      <span class="done-arrow" id="done-arrow">▶</span>
      Completed
      <span id="done-count" style="color:var(--purple);font-weight:600;margin-left:2px">0</span>
      <span style="margin-left:auto;font-size:10px;color:var(--muted)">tap to expand</span>
    </button>
    <div class="done-section" id="done-section"></div>

  </div>

  <!-- NOTES VIEW -->
  <div class="view" id="view-notes">
    <div class="notes-header">
      <div class="notes-title">Notes</div>
      <button class="btn-new-note" onclick="newNote()">+ New Note</button>
    </div>
    <div id="notes-list"></div>
  </div>

</div>

<!-- NOTE EDITOR OVERLAY -->
<div class="note-editor" id="note-editor">
  <div class="editor-topbar">
    <button class="btn-back" onclick="closeEditor()">← Back</button>
    <div class="editor-actions">
      <button class="btn-delete-note" id="btn-delete-note" onclick="deleteCurrentNote()">Delete</button>
    </div>
  </div>
  <div class="editor-color-bar">
    <span class="editor-color-label">Color</span>
    <div class="note-colors" id="editor-color-picker"></div>
  </div>
  <input class="editor-title-input" id="editor-title" type="text" placeholder="Title">
  <textarea class="editor-body-input" id="editor-body" placeholder="Start writing..."></textarea>
</div>

<script>
  // ── NOTE COLOR PALETTE ──
  const NOTE_COLORS = [
    { id: 'none',   bg: '#111128', text: '#eeeef8', dot: '#2a2a50' },
    { id: 'purple', bg: '#1e0e3e', text: '#e9d5ff', dot: '#7c3aed' },
    { id: 'navy',   bg: '#0b1437', text: '#bfdbfe', dot: '#1d4ed8' },
    { id: 'rose',   bg: '#2a0a16', text: '#fecdd3', dot: '#e11d48' },
    { id: 'amber',  bg: '#1e1204', text: '#fde68a', dot: '#d97706' },
    { id: 'teal',   bg: '#031a1a', text: '#99f6e4', dot: '#0d9488' },
    { id: 'slate',  bg: '#0f172a', text: '#cbd5e1', dot: '#475569' },
  ];

  // ── STATE ──
  let state = JSON.parse(localStorage.getItem('myspace_v3') || '{"tasks":[],"notes":[]}');
  let currentNoteId = null;
  let doneOpen = false;

  function save() { localStorage.setItem('myspace_v3', JSON.stringify(state)); }

  if (!state.tasks) state.tasks = [];
  if (!state.notes) state.notes = [];

  // Date
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });

  // ── TABS ──
  function switchTab(tab) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('view-' + tab).classList.add('active');
    document.querySelectorAll('.tab')[tab === 'todos' ? 0 : 1].classList.add('active');
    if (tab === 'notes') renderNotes();
  }

  // ── TASKS ──
  function addTask() {
    const input = document.getElementById('task-input');
    const text = input.value.trim();
    if (!text) return;
    const priority = document.getElementById('task-priority').value;
    state.tasks.unshift({ id: Date.now(), text, priority, done: false });
    save();
    input.value = '';
    renderTasks();
  }

  function toggleTask(id) {
    const t = state.tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); renderTasks(); }
  }

  function deleteTask(id) {
    state.tasks = state.tasks.filter(t => t.id !== id);
    save(); renderTasks();
  }

  function priorityTag(p) {
    const map = { high:['high','High'], med:['med','Med'], low:['low','Low'] };
    const [cls, label] = map[p] || ['med','Med'];
    return `<span class="tag tag-${cls}">${label}</span>`;
  }

  function taskHTML(t) {
    return `<div class="task-item ${t.done ? 'done-item' : ''}">
      <button class="task-check ${t.done ? 'checked' : ''}" onclick="toggleTask(${t.id})"></button>
      <div class="task-body">
        <div class="task-text ${t.done ? 'done' : ''}">${esc(t.text)}</div>
        <div class="task-meta">${priorityTag(t.priority)}</div>
      </div>
      <button class="task-delete" onclick="deleteTask(${t.id})">×</button>
    </div>`;
  }

  function renderTasks() {
    const active = state.tasks.filter(t => !t.done);
    const done   = state.tasks.filter(t => t.done);

    document.getElementById('active-tasks').innerHTML = active.length
      ? active.map(taskHTML).join('')
      : `<div class="empty"><div class="empty-glyph">✦</div>No active tasks.<br>Add something above.</div>`;

    document.getElementById('done-section').innerHTML = done.map(taskHTML).join('');
    document.getElementById('done-count').textContent = done.length;

    document.getElementById('stat-active').textContent = active.length;
    document.getElementById('stat-done').textContent   = done.length;
    document.getElementById('stat-high').textContent   = active.filter(t => t.priority === 'high').length;
  }

  function toggleDone() {
    doneOpen = !doneOpen;
    document.getElementById('done-section').classList.toggle('open', doneOpen);
    const arrow = document.getElementById('done-arrow');
    arrow.classList.toggle('open', doneOpen);
    arrow.textContent = doneOpen ? '▼' : '▶';
  }

  // ── NOTES ──
  function getColor(id) { return NOTE_COLORS.find(c => c.id === id) || NOTE_COLORS[0]; }

  function buildColorPicker(selectedId, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = NOTE_COLORS.map(c =>
      `<div class="color-dot ${c.id === selectedId ? 'selected' : ''}"
        style="background:${c.dot};"
        onclick="selectNoteColor('${c.id}', '${containerId}')"></div>`
    ).join('');
  }

  function selectNoteColor(colorId, containerId) {
    // Update picker UI
    buildColorPicker(colorId, containerId);
    // If editor is open, update background live
    if (currentNoteId !== null) {
      const c = getColor(colorId);
      const editor = document.getElementById('note-editor');
      editor.style.background = c.bg;
      editor.style.color = c.text;
      // store on note
      const note = state.notes.find(n => n.id === currentNoteId);
      if (note) { note.color = colorId; save(); }
    }
  }

  function newNote() {
    const note = { id: Date.now(), title: '', body: '', color: 'none', updated: Date.now() };
    state.notes.unshift(note);
    save();
    openEditor(note.id);
  }

  function openEditor(id) {
    currentNoteId = id;
    const note = state.notes.find(n => n.id === id);
    if (!note) return;

    const c = getColor(note.color || 'none');
    const editor = document.getElementById('note-editor');
    editor.style.background = c.bg;
    editor.style.color = c.text;

    document.getElementById('editor-title').value = note.title || '';
    document.getElementById('editor-body').value  = note.body  || '';
    buildColorPicker(note.color || 'none', 'editor-color-picker');

    editor.classList.add('open');
    document.getElementById('editor-title').focus();
  }

  function closeEditor() {
    const note = state.notes.find(n => n.id === currentNoteId);
    if (note) {
      const title = document.getElementById('editor-title').value.trim();
      const body  = document.getElementById('editor-body').value.trim();
      if (!title && !body) {
        // Empty note — discard
        state.notes = state.notes.filter(n => n.id !== currentNoteId);
      } else {
        note.title   = title || 'Untitled';
        note.body    = body;
        note.updated = Date.now();
      }
      save();
    }
    const editor = document.getElementById('note-editor');
    editor.classList.remove('open');
    editor.style.background = '';
    editor.style.color = '';
    currentNoteId = null;
    renderNotes();
  }

  function deleteCurrentNote() {
    const id = currentNoteId;
    if (id === null) return;
    // Close editor first, then delete
    const editor = document.getElementById('note-editor');
    editor.classList.remove('open');
    editor.style.background = '';
    editor.style.color = '';
    currentNoteId = null;
    state.notes = state.notes.filter(n => n.id !== id);
    save();
    renderNotes();
  }

  function renderNotes() {
    const el = document.getElementById('notes-list');
    if (!state.notes.length) {
      el.innerHTML = `<div class="empty"><div class="empty-glyph">✦</div>No notes yet.<br>Tap + New Note to start.</div>`;
      return;
    }
    el.innerHTML = state.notes.map(n => {
      const c    = getColor(n.color || 'none');
      const date = new Date(n.updated).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
      return `<div class="note-card" style="background:${c.bg};color:${c.text};" onclick="openEditor(${n.id})">
        <div class="note-card-title">${esc(n.title || 'Untitled')}</div>
        <div class="note-card-preview">${esc(n.body || 'Empty note')}</div>
        <div class="note-card-date">${date}</div>
      </div>`;
    }).join('');
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── INIT ──
  renderTasks();
  renderNotes();
</script>
</body>
</html>
