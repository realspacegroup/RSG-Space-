<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#09091a"/>
<title>RSG Space</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#09091a;color:#f0f0ff;font-family:'Montserrat',sans-serif;min-height:100vh;overflow-x:hidden}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(0.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes swipeReveal{from{transform:translateX(0)}to{transform:translateX(-72px)}}

.fade-up{animation:fadeUp 0.45s cubic-bezier(0.34,1.56,0.64,1) both}
.pop-in{animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both}

.page{max-width:480px;margin:0 auto;padding-bottom:90px}

/* ── HERO ── */
.hero{background:linear-gradient(155deg,#1c0545 0%,#0e1d45 55%,#09091a 100%);
  padding:44px 20px 28px;position:relative;overflow:hidden;margin-bottom:10px}
.blob1{position:absolute;top:-50px;right:-40px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,58,237,0.35) 0%,transparent 70%);pointer-events:none}
.blob2{position:absolute;bottom:-30px;left:-30px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(14,165,233,0.22) 0%,transparent 70%);pointer-events:none}
.hero-inner{position:relative;z-index:1}
.hero-eyebrow{font-size:11px;letter-spacing:0.12em;color:rgba(255,255,255,0.32);text-transform:uppercase;margin-bottom:5px}
.hero-name{font-family:'Bebas Neue',sans-serif;font-size:42px;font-weight:400;line-height:1.1;letter-spacing:2px;margin-bottom:2px;
  background:linear-gradient(135deg,#c4b5fd,#93c5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:13px;color:rgba(255,255,255,0.35);margin-bottom:22px}
.progress-row{display:flex;align-items:center;gap:18px}
.ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.prog-lbl{font-size:11px;color:rgba(255,255,255,0.32);margin-bottom:2px}
.prog-big{font-size:24px;font-weight:700}
.prog-big span{font-size:13px;color:rgba(255,255,255,0.32);font-weight:400}
.prog-notes{font-size:12px;color:rgba(255,255,255,0.32);margin-top:3px}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px;margin-bottom:10px}
.stat-box{background:#14142a;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px 10px;position:relative;overflow:hidden}
.stat-box::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--ac,#7c3aed),transparent);opacity:0.7}
.stat-lbl{font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:4px}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:26px;font-weight:400;letter-spacing:1px;color:var(--ac,#fff)}
.stat-unit{font-size:10px;color:rgba(255,255,255,0.25);margin-top:2px}

/* ── TABS ── */
.tab-wrap{padding:0 12px;margin-bottom:10px}
.tab-bar{display:flex;background:rgba(255,255,255,0.05);border-radius:12px;padding:4px;gap:4px}
.tab-btn{flex:1;padding:9px 0;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;border:none;
  background:transparent;color:rgba(255,255,255,0.38);font-family:'Montserrat',sans-serif;transition:all 0.28s}
.tab-btn.active{background:linear-gradient(135deg,#7c3aed,#0ea5e9);color:#fff;box-shadow:0 2px 12px rgba(124,58,237,0.35)}

/* ── CARD ── */
.card{background:#13132a;border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:18px 16px;margin:0 12px 10px}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap input{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;color:#fff;font-size:13px;outline:none;font-family:'Montserrat',sans-serif;
  width:100%;padding:10px 14px 10px 36px}
.search-wrap input:focus{border-color:rgba(124,58,237,0.45)}
.search-wrap input::placeholder{color:rgba(255,255,255,0.25)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:0.3;pointer-events:none}

/* ── FILTER PILLS ── */
.filter-row{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.fpill{padding:5px 14px;border-radius:99px;font-size:12px;cursor:pointer;font-weight:500;font-family:'Montserrat',sans-serif;
  border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.38);transition:all 0.22s}
.fpill.active{background:linear-gradient(135deg,#7c3aed,#0ea5e9);color:#fff;border-color:transparent;box-shadow:0 2px 10px rgba(124,58,237,0.3)}

/* ── SEC HEADER ── */
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-lbl{font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.28)}
.add-btn{padding:6px 14px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;border:none;
  color:#fff;font-family:'Montserrat',sans-serif;transition:opacity 0.2s,transform 0.15s}
.add-btn:active{opacity:0.82;transform:scale(0.96)}
.add-task-btn{background:linear-gradient(135deg,#7c3aed,#0ea5e9);box-shadow:0 2px 10px rgba(124,58,237,0.3)}
.add-note-btn{background:linear-gradient(135deg,#0ea5e9,#34d399);box-shadow:0 2px 10px rgba(14,165,233,0.25)}

/* ── FORM ── */
.form-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:14px;margin-bottom:14px;display:none}
.form-box.open{display:block;animation:fadeUp 0.3s ease}
.form-field{margin-bottom:10px}
.form-field input,.form-field select,.form-field textarea{
  width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;color:#fff;font-size:13px;padding:10px 13px;outline:none;
  font-family:'Montserrat',sans-serif;transition:border-color 0.2s}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:rgba(124,58,237,0.5)}
.form-field input::placeholder,.form-field textarea::placeholder{color:rgba(255,255,255,0.22)}
.form-field select option{background:#1a1a2e}
.form-field textarea{resize:none;line-height:1.6;height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.btn-cancel{padding:7px 16px;border-radius:9px;font-size:13px;cursor:pointer;
  border:1px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.38);font-family:'Montserrat',sans-serif}
.btn-save{padding:7px 20px;border-radius:9px;font-size:13px;cursor:pointer;border:none;
  font-weight:500;font-family:'Montserrat',sans-serif;color:#fff;transition:opacity 0.2s,transform 0.15s}
.btn-save:active{opacity:0.82;transform:scale(0.97)}
.btn-save-task{background:linear-gradient(135deg,#7c3aed,#0ea5e9)}
.btn-save-note{background:linear-gradient(135deg,#0ea5e9,#34d399)}

/* ── CHAR COUNTER ── */
.char-counter{font-size:11px;color:rgba(255,255,255,0.28);margin-top:4px;text-align:right;font-family:'Montserrat',sans-serif}
.char-counter.warn{color:#fbbf24}
.char-counter.danger{color:#f87171}

/* ── SWIPE TASK WRAPPER ── */
.swipe-wrap{position:relative;overflow:hidden;border-radius:14px;margin-bottom:8px}
.swipe-delete-bg{position:absolute;right:0;top:0;bottom:0;width:72px;
  background:linear-gradient(135deg,#e11d48,#f87171);
  display:flex;align-items:center;justify-content:center;border-radius:0 14px 14px 0;
  font-size:20px;color:#fff;flex-shrink:0}
.swipe-inner{position:relative;transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);touch-action:pan-y}
.swipe-inner.swiped{transform:translateX(-72px)}

/* ── TASK CARD ── */
.task-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);
  border-radius:14px;padding:13px 14px;border-left:3px solid;
  transition:opacity 0.3s}
.task-card.done{opacity:0.38}
.task-row{display:flex;align-items:flex-start;gap:10px}
.check-btn{width:22px;height:22px;border-radius:7px;flex-shrink:0;margin-top:2px;cursor:pointer;
  border:1.5px solid rgba(255,255,255,0.2);background:transparent;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.28s cubic-bezier(0.34,1.56,0.64,1)}
.check-btn.checked{background:linear-gradient(135deg,#7c3aed,#a78bfa);border-color:transparent;
  box-shadow:0 0 10px rgba(124,58,237,0.45)}
.task-title-txt{font-size:15px;font-weight:500;margin-bottom:3px;transition:color 0.25s}
.task-title-txt.done{color:rgba(255,255,255,0.28);text-decoration:line-through}
.task-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.ttag{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:500}
.task-timestamp{font-size:10px;color:rgba(255,255,255,0.22);margin-top:5px}
.task-subnote{font-size:12px;color:rgba(255,255,255,0.28);margin-top:4px;line-height:1.5}
.icon-btns{display:flex;gap:2px;flex-shrink:0}
.icon-btn{background:none;border:none;cursor:pointer;font-size:14px;opacity:0.3;padding:3px 5px;transition:opacity 0.2s}
.icon-btn:active{opacity:1}

/* ── NOTE CARD ── */
.note-card{border-radius:14px;padding:14px 15px;margin-bottom:8px;border:1px solid;
  transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1)}
.note-card:active{transform:scale(0.99)}
.note-card.pinned-card{border-width:1.5px}
.note-hdr{display:flex;justify-content:space-between;align-items:flex-start}
.note-title-txt{font-size:14px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.pin-badge{font-size:12px;opacity:0.7}
.note-body-txt{font-size:13px;color:rgba(255,255,255,0.52);line-height:1.65;white-space:pre-wrap}

/* ── COLOR DOTS ── */
.color-pick{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cdot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.2s,border-color 0.2s}
.cdot.selected{border-color:#fff;transform:scale(1.25)}

/* ── EXPORT BTN ── */
.export-row{display:flex;gap:8px;margin-bottom:14px}
.btn-export{flex:1;padding:9px 0;border-radius:10px;font-size:12px;font-weight:500;cursor:pointer;
  border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);
  color:rgba(255,255,255,0.55);font-family:'Montserrat',sans-serif;transition:all 0.2s;text-align:center}
.btn-export:active{background:rgba(255,255,255,0.08);color:#fff}

/* ── EMPTY ── */
.empty{text-align:center;padding:38px 0}
.empty-icon{font-size:38px;margin-bottom:8px}
.empty-txt{color:rgba(255,255,255,0.2);font-size:13px}

/* ── FOOTER ── */
.footer-card{background:linear-gradient(135deg,#1c0545,#0e1d45);
  border:1px solid rgba(124,58,237,0.2);border-radius:16px;padding:20px;margin:0 12px;text-align:center}
.footer-lbl{font-size:12px;color:rgba(255,255,255,0.3);margin-bottom:3px}
.footer-val{font-family:'Bebas Neue',sans-serif;font-size:22px;font-weight:400;letter-spacing:1.5px}

.hidden{display:none}
</style>
</head>
<body>
<div class="page">

  <!-- HERO -->
  <div class="hero fade-up" style="animation-delay:0ms">
    <div class="blob1"></div><div class="blob2"></div>
    <div class="hero-inner">
      <div class="hero-eyebrow">Your personal hub</div>
      <div class="hero-name">RSG Space</div>
      <div class="hero-sub">Tasks & notes. All yours.</div>
      <div class="progress-row">
        <div class="ring-wrap">
          <svg viewBox="0 0 72 72" style="transform:rotate(-90deg);width:72px;height:72px">
            <circle cx="36" cy="36" r="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="5"/>
            <circle id="ring-arc" cx="36" cy="36" r="28" fill="none" stroke="url(#rg)" stroke-width="5"
              stroke-dasharray="0 175.9" stroke-linecap="round"
              style="transition:stroke-dasharray 0.85s cubic-bezier(0.34,1.56,0.64,1)"/>
            <defs><linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#0ea5e9"/>
            </linearGradient></defs>
          </svg>
          <div class="ring-label" id="ring-pct">0%</div>
        </div>
        <div>
          <div class="prog-lbl">Tasks complete</div>
          <div class="prog-big"><span id="h-done">0</span> <span>/ <span id="h-total">0</span></span></div>
          <div class="prog-notes"><span id="h-notes">0</span> notes saved</div>
        </div>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stat-grid fade-up" style="animation-delay:80ms">
    <div class="stat-box" style="--ac:#a78bfa">
      <div class="stat-lbl">Active</div>
      <div class="stat-num" id="s-active">0</div>
      <div class="stat-unit">tasks</div>
    </div>
    <div class="stat-box" style="--ac:#f87171">
      <div class="stat-lbl">High</div>
      <div class="stat-num" id="s-high">0</div>
      <div class="stat-unit">priority</div>
    </div>
    <div class="stat-box" style="--ac:#34d399">
      <div class="stat-lbl">Done</div>
      <div class="stat-num" id="s-done">0</div>
      <div class="stat-unit">completed</div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tab-wrap fade-up" style="animation-delay:130ms">
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('tasks')">Tasks</button>
      <button class="tab-btn" onclick="switchTab('notes')">Notes</button>
    </div>
  </div>

  <!-- TASKS PANEL -->
  <div id="panel-tasks">
    <div class="card fade-up" style="animation-delay:180ms">

      <div class="export-row">
        <button class="btn-export" onclick="exportData()">⬇ Export Backup</button>
        <button class="btn-export" onclick="triggerImport()">⬆ Restore Backup</button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
      </div>

      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="task-search" placeholder="Search tasks..." oninput="renderTasks()">
      </div>

      <div class="filter-row">
        <button class="fpill active" id="f-all" onclick="setFilter('All')">All</button>
        <button class="fpill" id="f-active" onclick="setFilter('Active')">Active</button>
        <button class="fpill" id="f-done" onclick="setFilter('Done')">Done</button>
      </div>

      <div class="sec-hdr">
        <div class="sec-lbl">Tasks</div>
        <button class="add-btn add-task-btn" onclick="toggleTaskForm()">+ Add Task</button>
      </div>

      <div class="form-box" id="task-form">
        <div class="form-field">
          <input type="text" id="tf-title" placeholder="Task title..." maxlength="400" oninput="updateCharCount()">
          <div class="char-counter" id="char-count">0 / 400</div>
        </div>
        <div class="form-row">
          <div class="form-field" style="margin:0">
            <select id="tf-priority">
              <option value="High">🔴 High</option>
              <option value="Medium" selected>🟡 Medium</option>
              <option value="Low">🟣 Low</option>
            </select>
          </div>
          <div class="form-field" style="margin:0">
            <input type="text" id="tf-note" placeholder="Optional note...">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-cancel" onclick="cancelTask()">Cancel</button>
          <button class="btn-save btn-save-task" id="tf-btn" onclick="saveTask()">Add</button>
        </div>
      </div>

      <div id="task-list"></div>
    </div>
  </div>

  <!-- NOTES PANEL -->
  <div id="panel-notes" class="hidden">
    <div class="card fade-up" style="animation-delay:180ms">

      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="note-search" placeholder="Search notes..." oninput="renderNotes()">
      </div>

      <div class="sec-hdr">
        <div class="sec-lbl">Notes</div>
        <button class="add-btn add-note-btn" onclick="toggleNoteForm()">+ New Note</button>
      </div>

      <div class="form-box" id="note-form">
        <div class="form-field">
          <input type="text" id="nf-title" placeholder="Note title...">
        </div>
        <div class="form-field">
          <textarea id="nf-body" placeholder="Write something..."></textarea>
        </div>
        <div class="sec-lbl" style="margin-bottom:6px">Highlight colour</div>
        <div class="color-pick" id="nf-colors"></div>
        <div class="form-actions" style="margin-top:12px">
          <button class="btn-cancel" onclick="cancelNote()">Cancel</button>
          <button class="btn-save btn-save-note" id="nf-btn" onclick="saveNote()">Save</button>
        </div>
      </div>

      <div id="note-list"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer-card fade-up" style="animation-delay:220ms">
    <div class="footer-lbl">Total items tracked</div>
    <div class="footer-val" id="footer-total">0 tasks · 0 notes</div>
  </div>

</div>
<script>
const PRIO_COLOR = { High:'#f87171', Medium:'#fbbf24', Low:'#a78bfa' };
const PRIO_BG    = { High:'rgba(248,113,113,0.12)', Medium:'rgba(251,191,36,0.12)', Low:'rgba(167,139,250,0.12)' };
const NOTE_COLORS = ['#7c3aed','#0ea5e9','#f43f5e','#f59e0b','#10b981','#64748b','#ec4899'];

let tasks=[], notes=[], currentFilter='All', editTaskId=null, editNoteId=null, selColor=NOTE_COLORS[0];

function save(){localStorage.setItem('myspace_v5',JSON.stringify({tasks,notes}));}
function load(){const d=JSON.parse(localStorage.getItem('myspace_v5')||'{}');tasks=d.tasks||[];notes=d.notes||[];}

// ── HAPTIC ──
function haptic(ms=40){if(navigator.vibrate)navigator.vibrate(ms);}

// ── TABS ──
function switchTab(tab){
  ['tasks','notes'].forEach(t=>{
    document.getElementById('panel-'+t).classList.toggle('hidden',t!==tab);
    document.querySelectorAll('.tab-btn')[t==='tasks'?0:1].classList.toggle('active',t===tab);
  });
  renderAll();
}

// ── FILTER ──
function setFilter(f){
  currentFilter=f;
  ['All','Active','Done'].forEach(x=>{
    document.getElementById('f-'+x.toLowerCase()).classList.toggle('active',f===x);
  });
  renderTasks();
}

// ── CHAR COUNTER ──
function updateCharCount(){
  const v=document.getElementById('tf-title').value.length;
  const el=document.getElementById('char-count');
  el.textContent=v+' / 400';
  el.className='char-counter'+(v>360?' danger':v>300?' warn':'');
}

// ── EXPORT / IMPORT ──
function exportData(){
  const data=JSON.stringify({tasks,notes},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='rsgspace-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
  haptic(60);
}
function triggerImport(){document.getElementById('import-file').click();}
function importData(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const d=JSON.parse(ev.target.result);
      if(d.tasks&&d.notes){tasks=d.tasks;notes=d.notes;save();renderAll();haptic(80);alert('Backup restored!');}
      else alert('Invalid backup file.');
    }catch{alert('Could not read file.');}
  };
  reader.readAsText(file);
  e.target.value='';
}

// ── TASK FORM ──
function toggleTaskForm(){
  editTaskId=null;
  document.getElementById('tf-title').value='';
  document.getElementById('tf-priority').value='Medium';
  document.getElementById('tf-note').value='';
  document.getElementById('tf-btn').textContent='Add';
  updateCharCount();
  document.getElementById('task-form').classList.toggle('open');
}
function cancelTask(){document.getElementById('task-form').classList.remove('open');editTaskId=null;}
function saveTask(){
  const title=document.getElementById('tf-title').value.trim();
  if(!title)return;
  haptic(40);
  const obj={
    id:editTaskId||Date.now(),
    title,
    priority:document.getElementById('tf-priority').value,
    note:document.getElementById('tf-note').value.trim(),
    done:false,
    createdAt:editTaskId?tasks.find(t=>t.id===editTaskId)?.createdAt||Date.now():Date.now()
  };
  if(editTaskId!==null){
    const idx=tasks.findIndex(t=>t.id===editTaskId);
    obj.done=tasks[idx].done;
    tasks[idx]=obj;
  } else tasks.push(obj);
  save();cancelTask();renderAll();
}
function startEditTask(id){
  const t=tasks.find(x=>x.id===id);
  editTaskId=id;
  document.getElementById('tf-title').value=t.title;
  document.getElementById('tf-priority').value=t.priority;
  document.getElementById('tf-note').value=t.note||'';
  document.getElementById('tf-btn').textContent='Update';
  updateCharCount();
  document.getElementById('task-form').classList.add('open');
}
function toggleTask(id){
  haptic(50);
  tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);
  save();renderAll();
}
function deleteTask(id){haptic(60);tasks=tasks.filter(t=>t.id!==id);save();renderAll();}

// ── SWIPE TO DELETE ──
function initSwipe(el,id){
  let startX=0,curX=0,swiped=false;
  const inner=el.querySelector('.swipe-inner');
  el.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;swiped=inner.classList.contains('swiped');},{passive:true});
  el.addEventListener('touchmove',e=>{
    curX=e.touches[0].clientX-startX;
    if(!swiped&&curX<-10) inner.style.transform=`translateX(${Math.max(curX,-72)}px)`;
    if(swiped&&curX>10)   inner.style.transform=`translateX(${Math.min(curX-72,0)}px)`;
  },{passive:true});
  el.addEventListener('touchend',()=>{
    const moved=curX;
    inner.style.transform='';
    if(!swiped&&moved<-40){inner.classList.add('swiped');}
    else if(swiped&&moved>40){inner.classList.remove('swiped');}
  });
}

// ── NOTE FORM ──
function buildColorPicker(){
  document.getElementById('nf-colors').innerHTML=NOTE_COLORS.map(c=>
    `<div class="cdot${c===selColor?' selected':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`
  ).join('');
}
function pickColor(c){selColor=c;buildColorPicker();}
function toggleNoteForm(){
  editNoteId=null;selColor=NOTE_COLORS[0];
  document.getElementById('nf-title').value='';
  document.getElementById('nf-body').value='';
  document.getElementById('nf-btn').textContent='Save';
  buildColorPicker();
  document.getElementById('note-form').classList.toggle('open');
}
function cancelNote(){document.getElementById('note-form').classList.remove('open');editNoteId=null;}
function saveNote(){
  const title=document.getElementById('nf-title').value.trim();
  if(!title)return;
  haptic(40);
  const existing=editNoteId!==null?notes.find(n=>n.id===editNoteId):null;
  const obj={id:editNoteId||Date.now(),title,body:document.getElementById('nf-body').value,
    color:selColor,pinned:existing?existing.pinned:false};
  if(editNoteId!==null) notes=notes.map(n=>n.id===editNoteId?obj:n);
  else notes.push(obj);
  save();cancelNote();renderAll();
}
function startEditNote(id){
  const n=notes.find(x=>x.id===id);
  editNoteId=id;selColor=n.color;
  document.getElementById('nf-title').value=n.title;
  document.getElementById('nf-body').value=n.body;
  document.getElementById('nf-btn').textContent='Update';
  buildColorPicker();
  document.getElementById('note-form').classList.add('open');
}
function deleteNote(id){haptic(60);notes=notes.filter(n=>n.id!==id);save();renderAll();}
function togglePin(id){
  haptic(40);
  notes=notes.map(n=>n.id===id?{...n,pinned:!n.pinned}:n);
  save();renderNotes();
}

// ── TIMESTAMP ──
function fmtDate(ts){
  if(!ts)return'';
  const d=new Date(ts);
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' · '+
    d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
}

// ── RENDER TASKS ──
function renderTasks(){
  const q=document.getElementById('task-search').value.toLowerCase();
  const list=tasks.filter(t=>{
    if(currentFilter==='Active'&&t.done)return false;
    if(currentFilter==='Done'&&!t.done)return false;
    if(q&&!t.title.toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>['High','Medium','Low'].indexOf(a.priority)-['High','Medium','Low'].indexOf(b.priority));

  const el=document.getElementById('task-list');
  if(!list.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">🌙</div><div class="empty-txt">Nothing here</div></div>`;
    return;
  }
  el.innerHTML=list.map((t,i)=>{
    const pc=PRIO_COLOR[t.priority]||'#a78bfa';
    const pb=PRIO_BG[t.priority]||'rgba(167,139,250,0.12)';
    return `<div class="swipe-wrap fade-up" style="animation-delay:${i*55}ms" id="sw-${t.id}">
      <div class="swipe-delete-bg" onclick="deleteTask(${t.id})">🗑️</div>
      <div class="swipe-inner">
        <div class="task-card ${t.done?'done':''}" style="border-left-color:${pc}">
          <div class="task-row">
            <button class="check-btn ${t.done?'checked':''}" onclick="toggleTask(${t.id})">
              ${t.done?'<span style="color:#fff;font-size:12px;font-weight:700">✓</span>':''}
            </button>
            <div style="flex:1;min-width:0">
              <div class="task-title-txt ${t.done?'done':''}">${esc(t.title)}</div>
              <div class="task-tags">
                <span class="ttag" style="background:${pb};color:${pc}">${t.priority}</span>
              </div>
              ${t.note?`<div class="task-subnote">${esc(t.note)}</div>`:''}
              <div class="task-timestamp">${fmtDate(t.createdAt)}</div>
            </div>
            <div class="icon-btns">
              <button class="icon-btn" onclick="startEditTask(${t.id})">✏️</button>
              <button class="icon-btn" onclick="deleteTask(${t.id})">🗑️</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Init swipe on each
  list.forEach(t=>{
    const wrap=document.getElementById('sw-'+t.id);
    if(wrap)initSwipe(wrap,t.id);
  });
}

// ── RENDER NOTES ──
function renderNotes(){
  const q=document.getElementById('note-search').value.toLowerCase();
  const list=notes
    .filter(n=>!q||(n.title+n.body).toLowerCase().includes(q))
    .sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  const el=document.getElementById('note-list');
  if(!list.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">📭</div><div class="empty-txt">No notes yet</div></div>`;
    return;
  }
  el.innerHTML=list.map((n,i)=>
    `<div class="note-card fade-up ${n.pinned?'pinned-card':''}"
      style="background:${n.color}14;border-color:${n.pinned?n.color+'88':n.color+'38'};animation-delay:${i*55}ms">
      <div class="note-hdr">
        <div style="flex:1;min-width:0">
          <div class="note-title-txt" style="color:${n.color}">
            ${n.pinned?'<span class="pin-badge">📌</span>':''}${esc(n.title)}
          </div>
          <div class="note-body-txt">${esc(n.body)}</div>
        </div>
        <div class="icon-btns" style="margin-left:8px">
          <button class="icon-btn" onclick="togglePin(${n.id})" title="${n.pinned?'Unpin':'Pin'}">${n.pinned?'📌':'☆'}</button>
          <button class="icon-btn" onclick="startEditNote(${n.id})">✏️</button>
          <button class="icon-btn" onclick="deleteNote(${n.id})">🗑️</button>
        </div>
      </div>
    </div>`
  ).join('');
}

// ── STATS ──
function updateStats(){
  const active=tasks.filter(t=>!t.done).length;
  const done=tasks.filter(t=>t.done).length;
  const total=tasks.length;
  const high=tasks.filter(t=>t.priority==='High'&&!t.done).length;
  const pct=total?Math.round(done/total*100):0;
  const circ=175.9;
  document.getElementById('s-active').textContent=active;
  document.getElementById('s-high').textContent=high;
  document.getElementById('s-done').textContent=done;
  document.getElementById('h-done').textContent=done;
  document.getElementById('h-total').textContent=total;
  document.getElementById('h-notes').textContent=notes.length;
  document.getElementById('ring-pct').textContent=pct+'%';
  document.getElementById('ring-arc').setAttribute('stroke-dasharray',`${pct/100*circ} ${circ}`);
  document.getElementById('footer-total').textContent=`${total} task${total!==1?'s':''} · ${notes.length} note${notes.length!==1?'s':''}`;
}

function renderAll(){renderTasks();renderNotes();updateStats();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

load();buildColorPicker();renderAll();
</script>
